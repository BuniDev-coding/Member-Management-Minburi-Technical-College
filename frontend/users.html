<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>ผู้ใช้งาน | ระบบบริหารจัดการสมาชิกองค์การนักวิชาชีพในอนาคตแห่งประเทศไทย วิทยาลัยเทคนิคมีนบุรี</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</head>
<body>
  <div class="layout">
    <aside id="sidebar"></aside>
    <main class="main">
      <header id="header"></header>
      <section class="content">
        <div class="card" id="usersCard" hidden>
          <div class="card-head">
            <div class="card-title"><span class="ic" data-icon="shield"></span><div>บัญชีผู้ใช้งาน (Admin)<div class="card-sub">จัดการบัญชีและกำหนดสิทธิ์การเข้าถึง</div></div></div>
            <button class="btn btn-primary" id="btnAddUser"></button>
          </div>
          <div class="table-wrap"><table class="table">
            <thead><tr><th>ผู้ใช้งาน</th><th>บทบาท</th><th>สิทธิ์การเข้าถึง</th><th>เข้าระบบล่าสุด</th><th>สถานะ</th><th class="col-act"></th></tr></thead>
            <tbody id="userBody"></tbody>
          </table></div>
        </div>

        <div class="card" id="backupCard" hidden>
          <div class="card-head">
            <div class="card-title"><span class="ic" data-icon="database"></span><div>สำรองข้อมูล<div class="card-sub">สำรองไฟล์ฐานข้อมูล app.db ไปไว้ที่โฟลเดอร์ database/backups/</div></div></div>
            <button class="btn btn-primary" id="btnBackup"></button>
          </div>
          <div class="table-wrap"><table class="table" style="min-width:520px">
            <thead><tr><th>ชื่อไฟล์</th><th>วันที่สำรอง</th><th>ขนาด</th><th></th></tr></thead>
            <tbody id="backupBody"></tbody>
          </table></div>
        </div>
      </section>
    </main>
  </div>
  <script src="js/layout.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
