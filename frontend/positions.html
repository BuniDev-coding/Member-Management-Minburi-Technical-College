<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>จัดการตำแหน่ง | ระบบบริหารจัดการสมาชิกองค์การนักวิชาชีพในอนาคตแห่งประเทศไทย วิทยาลัยเทคนิคมีนบุรี</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</head>
<body>
  <div class="layout">
    <aside id="sidebar"></aside>
    <main class="main">
      <header id="header"></header>
      <section class="content">
        <div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)" id="posGrid">
          <div class="card">
            <div class="card-head">
              <div class="card-title"><span class="ic" data-icon="award"></span><div>ตำแหน่ง<div class="card-sub">จำนวนผู้ดำรงตำแหน่งในปีที่เลือก</div></div></div>
              <div class="flex">
                <select class="select" id="yearSel" style="width:auto;height:38px;font-size:14px" aria-label="ปีการศึกษา"></select>
                <button class="btn btn-primary btn-sm" id="btnAddPos" data-perm="settings"></button>
              </div>
            </div>
            <div class="list" id="posList"></div>
          </div>
          <div class="card">
            <div class="card-head"><div class="card-title"><span class="ic" data-icon="users"></span><div id="holderTitle">ผู้ดำรงตำแหน่ง<div class="card-sub">เลือกตำแหน่งทางซ้ายเพื่อดูรายชื่อ</div></div></div></div>
            <div id="holders"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <div class="card-title"><span class="ic" data-icon="building"></span><div>แผนกวิชา<div class="card-sub">ข้อมูลประกอบสำหรับสมาชิกและรายงาน</div></div></div>
            <button class="btn btn-primary btn-sm" id="btnAddDept" data-perm="settings"></button>
          </div>
          <div class="table-wrap"><table class="table" style="min-width:520px">
            <thead><tr><th>รหัส</th><th>ชื่อแผนกวิชา</th><th class="center">จำนวนสมาชิก</th><th class="col-act"></th></tr></thead>
            <tbody id="deptBody"></tbody>
          </table></div>
        </div>
      </section>
    </main>
  </div>
  <script src="js/layout.js"></script>
  <script src="js/positions.js"></script>
</body>
</html>
