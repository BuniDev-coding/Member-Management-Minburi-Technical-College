<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>คณะกรรมการ | ระบบสมาชิก วิทยาลัยเทคนิคมีนบุรี</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</head>
<body>
  <div class="layout">
    <aside id="sidebar"></aside>
    <main class="main">
      <header id="header"></header>
      <section class="content">
        <div class="card">
          <div class="card-head">
            <div class="card-title"><span class="ic" data-icon="briefcase"></span><div>คณะกรรมการดำเนินงาน (แบบ อวท.09)<div class="card-sub" id="cmSub">แต่งตั้งคณะกรรมการแยกตามปีการศึกษา</div></div></div>
            <div class="flex">
              <select class="select" id="yearSel" style="width:auto;height:38px;font-size:14px" aria-label="ปีการศึกษา"></select>
              <select class="select" id="deptSel" style="width:auto;height:38px;font-size:14px" aria-label="แผนกวิชา (ชมรม)"></select>
              <button class="btn btn-primary btn-sm" id="btnAppoint" data-perm="members.edit"></button>
              <button class="btn btn-danger btn-sm" id="btnDoc" data-perm="reports"></button>
            </div>
          </div>
          <div id="cmBody"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="js/layout.js"></script>
  <script src="js/member-picker.js"></script>
  <script src="js/committee.js"></script>
</body>
</html>
